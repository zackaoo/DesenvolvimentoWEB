<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sanus Corpus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>Sanus Corpus</header>

  <div class="container-main">
    <div class="form-box" id="cadastroBox">
      <h2 class="text-center mb-4">Cadastro</h2>
      <form id="formCadastro">
        <div class="mb-3">
          <input type="text" id="nome" class="form-control" placeholder="Nome" required>
        </div>
        <div class="mb-3">
          <input type="email" id="email" class="form-control" placeholder="Email" required>
        </div>
        <button type="submit" class="btn btn-warning w-100">Cadastrar</button>
      </form>
    </div>

    <div class="form-box d-none" id="treinoBox">
      <h2 class="text-center mb-4">Adicionar Treino</h2>
      <form id="formTreino">
        <div class="mb-3">
          <input type="text" id="exercicio" class="form-control" placeholder="Exercício" required>
        </div>
        <div class="mb-3">
          <input type="number" id="series" class="form-control" placeholder="Séries" required>
        </div>
        <div class="mb-3">
          <input type="number" id="repeticoes" class="form-control" placeholder="Repetições" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Adicionar Treino</button>
      </form>
    </div>

    <div id="treinos" class="d-none">
      <h4>Treinos Adicionados:</h4>
      <ul id="listaTreinos" class="list-group list-group-flush"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
